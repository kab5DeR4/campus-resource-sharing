<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f8fafc"/>
  <rect x="130" y="25" width="140" height="250" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="3"/>
  <!-- Graphing Screen -->
  <rect x="145" y="45" width="110" height="70" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
