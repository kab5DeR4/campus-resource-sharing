  <line x1="145" y1="80" x2="255" y2="80" stroke="#bae6fd" stroke-width="1.5"/>
  <line x1="200" y1="45" x2="200" y2="115" stroke="#bae6fd" stroke-width="1.5"/>
  <path d="M 145 80 Q 172 45 200 80 T 255 80" stroke="#facc15" stroke-width="2.5" fill="none"/>
  <!-- Function Keys -->
  <g fill="#3b82f6" rx="2">
    <rect x="145" y="125" width="24" height="12" rx="2"/><rect x="173" y="125" width="24" height="12" rx="2"/><rect x="201" y="125" width="24" height="12" rx="2"/><rect x="231" y="125" width="24" height="12" rx="2"/>
  </g>
  <!-- Main Keypad -->
  <g fill="#334155">
    <rect x="145" y="145" width="30" height="16" rx="3"/><rect x="185" y="145" width="30" height="16" rx="3"/><rect x="225" y="145" width="30" height="16" rx="3"/>
    <rect x="145" y="168" width="30" height="16" rx="3"/><rect x="185" y="168" width="30" height="16" rx="3"/><rect x="225" y="168" width="30" height="16" rx="3"/>
    <rect x="145" y="191" width="30" height="16" rx="3"/><rect x="185" y="191" width="30" height="16" rx="3"/><rect x="225" y="191" width="30" height="16" rx="3"/>
    <rect x="145" y="214" width="30" height="16" rx="3"/><rect x="185" y="214" width="30" height="16" rx="3"/><rect x="225" y="214" width="30" height="16" rx="3" fill="#22c55e"/>
  </g>
  <text x="200" y="255" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="bold">TI-84 Plus Graphing</text>
</svg>
