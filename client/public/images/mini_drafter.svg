<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f1f5f9"/>
  <!-- Drawing Board -->
  <rect x="50" y="40" width="300" height="220" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="4"/>
  <!-- Paper Sheet -->
  <rect x="75" y="60" width="250" height="180" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Board Clamp -->
  <rect x="50" y="40" width="30" height="25" fill="#334155" rx="2"/>
  <circle cx="65" cy="52" r="5" fill="#94a3b8"/>
  <!-- Drafter Arms -->
  <line x1="65" y1="52" x2="160" y2="120" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="120" x2="220" y2="150" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <!-- Protractor Head -->
  <circle cx="220" cy="150" r="18" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
  <!-- Scales L shape -->
  <rect x="220" y="146" width="90" height="8" fill="rgba(255,255,255,0.8)" stroke="#64748b" stroke-width="1"/>
  <rect x="216" y="150" width="8" height="70" fill="rgba(255,255,255,0.8)" stroke="#64748b" stroke-width="1"/>
</svg>
