<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#0f172a"/>
  <!-- Arduino PCB -->
  <rect x="70" y="70" width="160" height="120" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="3"/>
  <!-- USB B Connector -->
  <rect x="55" y="85" width="20" height="25" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <!-- MCU Chip -->
  <rect x="120" y="110" width="60" height="20" fill="#1e293b"/>
  <circle cx="125" cy="115" r="2" fill="#94a3b8"/>
  <text x="150" y="124" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">ATmega328P</text>
  <!-- Header Pins -->
  <rect x="85" y="75" width="130" height="8" fill="#1e293b"/>
  <rect x="85" y="177" width="130" height="8" fill="#1e293b"/>
  <!-- Arduino text -->
  <text x="180" y="150" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">UNO</text>
  <!-- Breadboard beside it -->
  <rect x="250" y="60" width="90" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="295" y1="60" x2="295" y2="240" stroke="#ef4444" stroke-width="2"/>
  <line x1="300" y1="60" x2="300" y2="240" stroke="#3b82f6" stroke-width="2"/>
  <!-- Jumper wires -->
  <path d="M 150 80 Q 200 40 270 90" stroke="#eab308" stroke-width="4" fill="none"/>
  <path d="M 160 180 Q 220 220 280 160" stroke="#22c55e" stroke-width="4" fill="none"/>
</svg>
